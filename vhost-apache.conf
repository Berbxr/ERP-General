# =============================================================================
# Configuración Apache para demo9.inetmxli.com (Plesk)
# =============================================================================
# Este contenido debe ir en:
#   /var/www/vhosts/system/demo9.inetmxli.com/conf/vhost.conf
#   /var/www/vhosts/system/demo9.inetmxli.com/conf/vhost_ssl.conf
#
# IMPORTANTE: Actualiza AMBOS archivos con este mismo contenido.
# Luego recarga Apache: systemctl reload apache2
# =============================================================================

RewriteEngine On
ProxyPreserveHost On

# 1. API: Proxy reverso al backend (puerto 9000)
RewriteRule ^/api/(.*) http://localhost:9000/api/$1 [P,L]

# 2. Si el archivo existe en dist/, servirlo directamente
RewriteCond %{REQUEST_URI} !^/api/
RewriteCond /var/www/vhosts/inetmxli.com/demo9.inetmxli.com/ERP-General/frontend/dist%{REQUEST_URI} -f
RewriteRule ^/(.*) /var/www/vhosts/inetmxli.com/demo9.inetmxli.com/ERP-General/frontend/dist/$1 [L]

# 3. SPA Fallback: todo lo demas -> index.html (React Router)
RewriteCond %{REQUEST_URI} !^/api/
RewriteRule ^/(.*) /var/www/vhosts/inetmxli.com/demo9.inetmxli.com/ERP-General/frontend/dist/index.html [L]
