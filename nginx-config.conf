# =============================================================================
# Configuración Nginx para demo9.inetmxli.com
# ERP Podocure - Frontend estático + Proxy reverso al backend
# =============================================================================
# Ubicación típica en el VPS:
#   /etc/nginx/sites-available/demo9.inetmxli.com
#   (luego symlink a /etc/nginx/sites-enabled/)
#
# Si usas Plesk, pega esto en:
#   "Apache & nginx Settings" > "Additional nginx directives"
# =============================================================================

server {
    listen 80;
    server_name demo9.inetmxli.com;

    # Ruta donde Vite genera el build de producción
    root /var/www/vhosts/inetmxli.com/demo9.inetmxli.com/ERP-General/frontend/dist;
    index index.html;

    # Tamaño máximo de upload (para formularios, imágenes, etc.)
    client_max_body_size 20M;

    # ---------------------------------------------------------------------------
    # 1. API: Proxy reverso al backend en puerto 9000
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # ---------------------------------------------------------------------------
    # 2. Archivos estáticos (JS, CSS, imágenes, fuentes)
    # ---------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------------
    # 3. SPA Fallback: cualquier ruta que no sea archivo -> index.html
    #    React Router maneja las rutas del lado del cliente
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # 4. Seguridad básica: denegar acceso a archivos ocultos
    # ---------------------------------------------------------------------------
    location ~ /\. {
        deny all;
    }
}
